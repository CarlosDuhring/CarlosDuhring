name: Update status card

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/status.js"

permissions:
  contents: write

concurrency:
  group: status-card
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate status.svg
        run: node scripts/status.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain assets/status.svg)" ]; then
            echo "Cartão já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status.svg
          git commit -m "chore: atualiza cartão de estatísticas"
          git push
