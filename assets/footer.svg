<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" fill="none" role="img" aria-label="Rodapé — fim da transmissão">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#12061F"/>
      <stop offset="50%"  stop-color="#0D0518"/>
      <stop offset="100%" stop-color="#0A0414"/>
    </linearGradient>

    <linearGradient id="bus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#C084FC" stop-opacity="0.75"/>
      <stop offset="82%"  stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#E9D5FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <style>
      .mono { font-family: "Cascadia Mono", "Consolas", "Courier New", monospace; }
      .txt  { font: 500 14px "Cascadia Mono", "Consolas", "Courier New", monospace; fill: #E9D5FF; }
      .dim  { font: 600 10px "Cascadia Mono", "Consolas", "Courier New", monospace; fill: #C084FC; letter-spacing: 2.5px; }
    </style>
  </defs>

  <rect width="1200" height="120" fill="url(#fbg)"/>
  <rect x="0" y="0" width="1200" height="1" fill="url(#edge)"/>

  <!-- barramento de dados -->
  <path d="M0 62 H1200" stroke="url(#bus)" stroke-width="1.6"/>
  <path d="M0 62 H1200" stroke="#C084FC" stroke-width="1.4" stroke-dasharray="4 26" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;-300" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- derivações + nós pulsantes -->
  <g stroke="#A855F7" stroke-width="1.2" fill="none" opacity="0.42">
    <path d="M120 62 V38 H176"/>
    <path d="M300 62 V86 H356"/>
    <path d="M480 62 V38 H536"/>
    <path d="M660 62 V86 H716"/>
    <path d="M840 62 V38 H896"/>
    <path d="M1020 62 V86 H1076"/>
  </g>

  <g fill="#C084FC">
    <circle cx="176" cy="38" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="356" cy="86" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="536" cy="38" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="716" cy="86" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="896" cy="38" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1076" cy="86" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- linha inferior: status -->
  <text class="txt" x="42" y="108">carlos@duhring:~$</text>
  <rect x="192" y="96" width="9" height="14" fill="#E9D5FF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text class="dim" x="1158" y="108" text-anchor="end">EOF</text>
  <circle cx="1120" cy="103" r="3" fill="#C084FC">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- etiqueta central -->
  <text class="dim" x="600" y="30" text-anchor="middle" opacity="0.45">// END OF TRANSMISSION</text>
</svg>
